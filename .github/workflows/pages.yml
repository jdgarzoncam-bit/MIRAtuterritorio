name: Publicar MIRA TU TERRITORIO en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # No cancelar una publicación activa: deploy-pages puede mantenerla en curso
  # y rechazar la siguiente solicitud. GitHub conservará la última ejecución pendiente.
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar entorno de validación
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxis y pruebas antes de publicar
        run: npm run validate

      - name: Preparar archivos del sitio
        # Solo se publica lo que el navegador necesita. Quedan fuera documentación
        # interna, migraciones SQL, pruebas, workflows y copias de respaldo (.zip).
        run: |
          mkdir _site
          tar -cf - \
            --exclude='./_site' --exclude='./.git' --exclude='./.github' \
            --exclude='./docs' --exclude='./migrations' --exclude='./tests' \
            --exclude='./scripts' --exclude='./node_modules' \
            --exclude='./MIRAtuterritorio-preview-*' \
            --exclude='./package.json' --exclude='*.md' --exclude='./.gitignore' \
            . | tar -xf - -C _site
          test -f _site/index.html

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
