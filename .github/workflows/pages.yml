name: Publicar MIRA TU TERRITORIO en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # No cancelar una publicación activa: deploy-pages puede mantenerla en curso
  # y rechazar la siguiente solicitud. GitHub conservará la última ejecución pendiente.
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar entorno de validación
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxis antes de publicar
        run: |
          node --check app.js
          node --check mira-data.js
          node --check mira-auth.js
          node --check pmu-navigation.js

      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
