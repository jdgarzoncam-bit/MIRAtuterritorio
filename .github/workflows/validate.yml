name: Validar JavaScript de MIRA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comprobar sintaxis JavaScript
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check
      - name: Probar regresión de PIN único y navegación
        run: node --test tests/single-pin.test.cjs
      - name: Probar registro de personas sin InfoMIRA
        run: node --test tests/infomira-inactive-registration.test.cjs
      - name: Probar seguridad de Reportes Operativos
        run: node --test tests/public-operational-reports.test.cjs
