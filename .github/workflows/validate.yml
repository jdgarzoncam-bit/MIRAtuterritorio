name: Validar JavaScript de MIRA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comprobar sintaxis JavaScript
        run: npm run check
      - name: Bloquear endpoints de Neon QA en producción
        run: node --test tests/production-endpoints.test.cjs
      - name: Probar regresión de PIN único y navegación
        run: node --test tests/single-pin.test.cjs
      - name: Probar registro de personas sin InfoMIRA
        run: node --test tests/infomira-inactive-registration.test.cjs
      - name: Probar integridad del archivo de Actividades
        run: node --test tests/activity-data-integrity-current.test.cjs
      - name: Probar versión de Control Administrativo
        run: node --test tests/control-admin-cache.test.cjs
      - name: Probar RPCs seguros de Control Administrativo
        run: node --test tests/control-admin-rpc.test.cjs
      - name: Probar aprobación y cambio de rol en Control Administrativo
        run: node --test tests/control-admin-profile-update.test.cjs
      - name: Probar retiro de módulos y accesos heredados
        run: node --test tests/retired-modules-security.test.cjs
      - name: Probar versión única de mira-data.js
        run: node --test tests/module-version-consistency.test.cjs
