name: Validar JavaScript de MIRA

on:
  push:
    branches:
      - feat/landing-reportes-testigos-e14
  pull_request:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check app.js
          node --check mira-data.js
          node --check mira-auth.js
          node --check mira-admin.js
          node --check pmu-navigation.js
      - name: Ejecutar pruebas de seguridad del cliente
        run: node --test tests/*.test.cjs
