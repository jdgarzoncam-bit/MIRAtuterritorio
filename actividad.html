<!DOCTYPE html><html lang="es" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIRA TU TERRITORIO — Registro de Actividades</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.activity-public-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top left,rgba(0,205,230,.12),transparent 45%),#050b17;color:#f4f8ff}.activity-public-card{width:min(920px,100%);border:1px solid rgba(31,220,245,.75);border-radius:24px;background:rgba(8,17,34,.94);box-shadow:0 20px 80px #0005,0 0 35px #00cde614;padding:clamp(20px,4vw,36px)}.activity-public-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid #7890aa33;padding-bottom:18px;margin-bottom:22px}.activity-public-head h1{margin:8px 0 4px;font-size:clamp(25px,4vw,38px)}.activity-public-head h1 span{color:#36d9ef}.activity-public-head p,.activity-public-note{color:#91a4bb}.activity-public-pill{display:inline-block;border:1px solid #24d9ee;border-radius:30px;padding:5px 11px;color:#39e5f5;font-size:11px;font-weight:800;letter-spacing:.08em}.activity-public-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.activity-public-form label{display:grid;gap:7px;color:#40e3f3;font-size:13px;font-weight:700}.activity-public-form input,.activity-public-form select{width:100%;min-width:0;box-sizing:border-box;background:#060d1b;border:1px solid #243347;border-radius:10px;padding:13px;color:#f4f8ff;font:inherit}.activity-public-form .full{grid-column:1/-1}.activity-public-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}.activity-public-actions button,.activity-public-form .lookup{border:1px solid #1dd9ee;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;color:white;background:#2054df}.activity-public-actions .secondary,.activity-public-form .lookup{background:#111c2d}.activity-public-note{font-size:12px;margin-top:18px}.activity-public-status{padding:12px;border-radius:10px;margin-top:16px;display:none;background:#1bbe8920;border:1px solid #1bbe8970;color:#8ff0cb}@media(max-width:620px){.activity-public-form{grid-template-columns:1fr}.activity-public-form .full{grid-column:auto}.activity-public-head{flex-direction:column}}
</style></head><body class="theme-dark"><main class="activity-public-shell"><section class="activity-public-card"><header class="activity-public-head"><div><span class="activity-public-pill">MIRA TU TERRITORIO · REGISTRO</span><h1>Registro de <span>Actividades</span></h1><p>Formulario exclusivo para registrar participantes.</p></div><a href="index.html" style="color:#40e3f3;text-decoration:none;font-weight:700">Volver ↗</a></header><form id="publicActivityForm" class="activity-public-form" autocomplete="off"><label>Cédula<input id="pubCedula" inputmode="numeric" required placeholder="Número de documento"></label><div style="display:flex;align-items:end"><button type="button" id="pubLookup" class="lookup" style="width:100%">⌕ Buscar ficha</button></div><label>Nombres<input id="pubNames" required placeholder="Nombres"></label><label>Apellidos<input id="pubSurnames" required placeholder="Apellidos"></label><label>Teléfono (opcional)<input id="pubPhone" inputmode="tel" placeholder="Teléfono"></label><label>Actividad<select id="pubActivity" required><option value="">Seleccionar actividad…</option></select></label><label>InfoMIRA<select id="pubInfo" required><option value="">Seleccionar Sí / No</option><option value="si">Sí</option><option value="no">No</option></select></label><div class="full activity-public-actions"><button type="submit">Guardar asistencia</button><button type="reset" class="secondary">Limpiar formulario</button></div></form><div id="pubStatus" class="activity-public-status" role="status"></div><p class="activity-public-note">Interfaz de registro sin acceso al panel administrativo. Esta versión guarda datos en el navegador actual; para compartirlos entre usuarios hace falta conectar una base de datos.</p></section></main><script src="activity-portal.js"></script></body></html>
