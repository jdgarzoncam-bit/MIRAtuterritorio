<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIRA TU TERRITORIO | Gestión de testigos</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:1100px;margin:4vh auto;padding:16px}.card{background:rgba(20,28,42,.96);border:1px solid #ffffff22;border-radius:18px;padding:24px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card label{display:block;margin:12px 0}.card input,.card select{width:100%;padding:11px;margin-top:6px;border-radius:9px;border:1px solid #526078;background:#111a29;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:10px;border-bottom:1px solid #ffffff1c}button{cursor:pointer;padding:8px 12px;border-radius:8px;border:0}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><p class="brand-pill">MIRA TU TERRITORIO · ACCESO INTERNO</p><h1>Gestión de registros de testigos</h1><p>Solo personal autenticado y con perfil activo puede consultar estos registros.</p><form id="loginForm"><div class="grid"><label>Correo institucional<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label></div><button class="login-btn" id="loginBtn" type="submit">Ingresar</button><p id="loginStatus" role="status"></p></form><div id="panel" class="hidden"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>Registros recibidos</h2><div><button id="refreshBtn">Actualizar</button> <button id="logoutBtn">Cerrar sesión</button></div></div><p id="panelStatus" role="status"></p><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Contacto</th><th>Puesto</th><th>Mesa</th><th>Fecha</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div></div></section><a href="index.html">Volver a MIRA TU TERRITORIO</a></main><script type="module" src="testigos-admin.js"></script></body></html>
