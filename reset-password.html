<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña · MIRA TU TERRITORIO</title>
<style>
:root{color-scheme:dark;--cyan:#00c8f5;--text:#e8f3ff;--muted:#a8bdd4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#123b62 0%,#07172d 58%,#04101f 100%);font-family:Inter,Arial,sans-serif;color:var(--text)}
.card{width:min(100%,460px);padding:38px;border:1px solid var(--cyan);border-radius:30px;background:rgba(7,24,47,.96);box-shadow:0 20px 70px #0008}
.tag{display:inline-block;padding:4px 10px;border:1px solid var(--cyan);border-radius:20px;color:#5deaff;font-size:12px;font-weight:800}
h1{font-size:26px;margin:22px 0 8px}
p{color:var(--muted);line-height:1.5;font-size:14px}
label{display:block;margin:20px 0 8px;font-size:13px;color:#c2d4e8}
input{width:100%;height:46px;border:1px solid #1477a5;border-radius:18px;background:#031126;color:white;padding:0 14px;font-size:14px;outline:none}
button{width:100%;margin-top:24px;height:48px;border:0;border-radius:17px;background:linear-gradient(100deg,#0784ec,#174ee5);color:white;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.notice{margin-top:18px;color:#ff9aaa;font-size:13px;min-height:20px;line-height:1.5}
.back{display:block;text-align:center;color:#52e4ff;margin-top:20px;font-size:13px}
</style>
</head>
<body>
<main class="card">
<span class="tag">SEGURIDAD · MIRA TU TERRITORIO</span>
<h1>Nueva contraseña</h1>
<p>Define una contraseña nueva para tu cuenta. Usa al menos 8 caracteres y evita compartirla.</p>
<form id="resetForm">
<label for="newPassword">Nueva contraseña</label>
<input id="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
<label for="confirmPassword">Confirmar contraseña</label>
<input id="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
<button id="saveButton" type="submit">Guardar nueva contraseña</button>
</form>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<a class="back" href="https://jdgarzoncam-bit.github.io/">Volver al inicio de sesión</a>
</main>
<script type="module">
import { createAuthClient } from "https://esm.sh/@neondatabase/auth@0.7.0-beta";
const AUTH_URL="https://ep-round-dawn-b7l3ya3h.neonauth.c-13.us-east-1.aws.neon.tech/neondb/auth";
const auth=createAuthClient(AUTH_URL,{allowAnonymous:true});
const form=document.getElementById("resetForm");
const notice=document.getElementById("notice");
const button=document.getElementById("saveButton");
const params=new URLSearchParams(window.location.search);
const token=params.get("token");
const error=params.get("error");
if(error){notice.textContent="El enlace de recuperación expiró o no es válido. Regresa al inicio y solicita uno nuevo.";form.hidden=true;}
if(!token&&!error){notice.textContent="No encontramos el código de recuperación en este enlace. Solicita uno nuevo desde el inicio de sesión.";form.hidden=true;}
form.addEventListener("submit",async event=>{
 event.preventDefault();
 const password=document.getElementById("newPassword").value;
 const confirmation=document.getElementById("confirmPassword").value;
 if(password.length<8){notice.textContent="La contraseña debe tener al menos 8 caracteres.";return;}
 if(password!==confirmation){notice.textContent="Las contraseñas no coinciden.";return;}
 button.disabled=true;
 notice.style.color="#a8bdd4";
 notice.textContent="Actualizando tu contraseña…";
 try{
  const result=await auth.resetPassword({newPassword:password,token});
  if(result?.error) throw new Error(result.error.message||"No fue posible actualizar la contraseña.");
  form.hidden=true;
  notice.style.color="#65e6b7";
  notice.textContent="Contraseña actualizada correctamente. Ya puedes ingresar con tu correo y la nueva contraseña.";
 }catch(err){
  notice.style.color="#ff9aaa";
  notice.textContent=err?.message||"El enlace expiró o ya fue utilizado. Solicita uno nuevo.";
 }finally{button.disabled=false;}
});
</script>
</body>
</html>
