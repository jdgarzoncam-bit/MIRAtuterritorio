<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIRA TU TERRITORIO | Crear cuenta</title>
<link rel="stylesheet" href="style.css?v=20261031-open-signup-approval-1">
<style>
.signup-wrap{width:min(560px,100% - 28px);margin:clamp(20px,7vh,64px) auto;padding:10px}
.signup-card{background:linear-gradient(145deg,rgba(18,36,58,.97),rgba(5,17,36,.98));border:1px solid rgba(64,190,240,.28);border-radius:24px;padding:clamp(20px,5vw,32px);box-shadow:0 22px 60px #0006,inset 0 1px 0 #ffffff14;color:#eef6ff}
.signup-card h1{font-size:clamp(1.6rem,6vw,2.1rem);margin:12px 0 8px}.signup-card p{line-height:1.55;color:#b7c9df}
.signup-card label{display:block;margin:15px 0;color:#c8d9f5;font-weight:650;font-size:.9rem}
.signup-card input{display:block;width:100%;box-sizing:border-box;padding:14px;margin-top:7px;border-radius:13px;border:1px solid rgba(0,183,235,.5);background:#06132a;color:#fff;font:inherit;min-height:48px}
.signup-notice{background:#ffffff0b;border:1px solid #ffffff18;padding:13px;border-radius:13px}
.signup-status{margin-top:14px;padding:12px;border-radius:12px;line-height:1.5}.signup-status:empty{display:none}.signup-status.error{border:1px solid #f87171;color:#fecaca;background:#7f1d1d22}.signup-status.success{border:1px solid #22c5e5;color:#d7f7ff;background:#0c4a6e35}
.signup-secondary{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.signup-secondary a{color:#5de4f5;text-decoration:underline;text-underline-offset:3px}
.signup-hidden{display:none!important}
@media(max-width:480px){.signup-wrap{margin:16px auto}.signup-card{border-radius:20px;padding:20px}.signup-card .login-btn{width:100%}}
</style>
</head>
<body class="theme-dark">
<main class="signup-wrap">
<section class="signup-card">
<p class="brand-pill">MIRA TU TERRITORIO · CUENTAS</p>
<h1>Crear cuenta</h1>
<p class="signup-notice">Confirma tu correo electrónico para completar la solicitud. Después, el administrador deberá aprobar tu cuenta y asignarte permisos. Crear una cuenta no habilita el acceso a los módulos ni a los datos.</p>
<form id="signupForm" novalidate>
<div id="signupFields">
<label>Nombre completo<input name="name" required maxlength="120" autocomplete="name"></label>
<label>Correo electrónico<input name="email" type="email" required maxlength="254" autocomplete="email" inputmode="email"></label>
<label>Contraseña<input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
<button class="login-btn" id="signupBtn" type="submit">Crear cuenta y enviar código</button>
</div>
<div id="verificationFields" class="signup-hidden">
<label for="verificationCode">Código de confirmación</label>
<input id="verificationCode" name="verificationCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="Escribe el código recibido">
<button class="login-btn" id="verifyBtn" type="button">Confirmar correo</button>
<button class="account-link-btn" id="resendCodeBtn" type="button">Reenviar código</button>
</div>
<p id="status" class="signup-status" role="status" aria-live="polite"></p>
</form>
<div class="signup-secondary"><a href="index.html">← Volver al ingreso</a><a href="index.html">Ir al inicio</a></div>
</section>
</main>
<script type="module" src="registro-usuario.js?v=20261031-open-signup-approval-1"></script>
</body></html>
