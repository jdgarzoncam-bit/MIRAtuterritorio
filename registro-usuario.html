<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIRA TU TERRITORIO | Solicitar acceso</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:560px;margin:7vh auto;padding:18px}.card{background:rgba(20,28,42,.96);border:1px solid #ffffff22;border-radius:18px;padding:28px}.card label{display:block;margin:14px 0}.card input{display:block;width:100%;padding:12px;margin-top:6px;border-radius:9px;border:1px solid #526078;background:#111a29;color:#fff}.notice{background:#ffffff0c;padding:12px;border-radius:9px;line-height:1.5}</style></head><body><main class="wrap"><section class="card"><p class="brand-pill">MIRA TU TERRITORIO · CUENTAS</p><h1>Solicitar acceso</h1><p class="notice">Crear una cuenta no concede acceso a los registros. El administrador debe revisar la solicitud y asignar un rol desde el panel seguro.</p><form id="signupForm"><label>Nombre completo<input name="name" required maxlength="120"></label><label>Correo institucional<input name="email" type="email" required autocomplete="email"></label><label>Contraseña<input name="password" type="password" minlength="10" autocomplete="new-password" required></label><button class="login-btn" id="signupBtn" type="submit">Crear solicitud de cuenta</button><p id="status" role="status" aria-live="polite"></p></form><a href="index.html">Volver al inicio de sesión</a></section></main><script type="module" src="registro-usuario.js"></script></body></html>
